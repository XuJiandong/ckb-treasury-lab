[workspace]
resolver = "2"

members = [
  # Please don't remove the following line, we use it to automatically
  # detect insertion point for newly generated crates.
  # @@INSERTION_POINT@@
  "contracts/always-success",
  "contracts/config-type-script",
  "contracts/counting-type-script",
  "contracts/vote-type-script",
  "contracts/proposal-type-script",
  "crates/ckb-vote-types",
  "crates/ckb-vote-common",
  "tests",
]

[profile.release]
overflow-checks = true
strip = true
debug = false
